spring.application.name=url-shortener-api
# Carrega automaticamente o arquivo .env da raiz (se existir)
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
# Conexao JDBC com MySQL: obrigatoriamente em UMA linha e em UTC
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true